providers = ["php"]

[phases.setup]
nixPkgs = ["php82", "php82Extensions.gd", "php82Extensions.pdo_mysql", "php82Extensions.curl", "composer"]
# Tambahkan ini untuk memastikan library sistem pendukung GD terinstall
aptPkgs = ["libpng-dev", "libjpeg-dev", "libfreetype6-dev"]

[phases.install]
# Tambahkan --ignore-platform-req=ext-gd agar composer tidak rewel saat build
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-gd"]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"